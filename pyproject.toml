[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nova-assistant"
version = "0.1.0"
description = "Nova: a local-first AI assistant CLI with pluggable tools"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Nova" }]
dependencies = [
  "typer>=0.12.4",
  "rich>=13.9.2",
  "pydantic>=2.8.2",
  "httpx>=0.27.2",
  "python-dotenv>=1.0.1",
  "openai>=1.52.2",
]

[project.scripts]
nova = "nova.cli:main"

[tool.setuptools]
packages = { find = { where = ["."], include = ["nova*"] } }
