[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-assistant"
version = "0.1.0"
description = "Minimal JARVIS-like assistant CLI with local-first design."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "Mini JARVIS" }
]
keywords = ["assistant", "jarvis", "cli", "automation", "voice", "ai"]

[project.urls]
Homepage = "https://example.com"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
jarvis = "jarvis_assistant.cli:main"

[project.optional-dependencies]
openai = ["openai>=1.43.0"]
tts = ["pyttsx3>=2.90"]
http = ["requests>=2.31.0"]
